name: Validate AceKit
on: [pull_request]
permissions:
  contents: read
jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run lint && npm test
      - run: npm pack --dry-run --ignore-scripts
